[package]
name = "brailer"
version = "0.1.0"
edition = "2024"
description = "Deterministic design compiler: semantic JSON spec in, SVG/PNG out, no browser"
readme = "README.md"
authors = ["NexGenCodes <74940049+NexGenCodes@users.noreply.github.com>"]
keywords = ["design", "svg", "layout", "typography", "raster"]
categories = ["command-line-utilities", "graphics", "text-processing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
resvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
usvg = "0.48.1"

[dev-dependencies]
png = "0.17"
