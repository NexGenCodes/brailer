name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: corpus verifies clean
        run: |
          cargo build --release
          for spec in tests/corpus/*.json; do
            target/release/brailer verify "$spec" --strict
          done
