name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf brailer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz brailer
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/brailer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
